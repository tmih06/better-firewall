# better-firewall CI — runs on every push, every pull request, and on manual
# dispatch (Actions → CI → Run workflow). Actions are pinned to commit SHAs.
#
# Privileged integration tests go through scripts/ci/isolate.sh. The k6
# performance and attack-lab jobs instead confine firewall changes and
# traffic to two containers on an internal-only Docker network on a
# disposable hosted runner. Do NOT reproduce either privileged job
# locally — see README §Development.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep the newest main/default-branch runs alive so every push there gets a
  # full result; cancel superseded PR/branch runs.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  STATICCHECK_VERSION: '2026.2.1'
  GOVULNCHECK_VERSION: 'v1.8.0'
  ACTIONLINT_VERSION: 'v1.7.12'
  GITLEAKS_VERSION: 'v8.30.1'
  K6_VERSION: '2.3.0'
  GO_STABLE: '1.27.x'
  GO_OLD: '1.26.x'
  GO_MIN: '1.22.x'

jobs:
  # ------------------------------------------------------------------ lint
  # gofmt, module-file consistency, go vet, pinned staticcheck, actionlint
  # (this workflow), shellcheck (scripts/**/*.sh). Mirrors check.sh minus vuln.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # staticcheck 2026.2.1 does not parse Go 1.27 standard-library syntax.
          # Build/test jobs still cover Go 1.27; lint runs on supported Go 1.26.
          go-version: ${{ env.GO_OLD }}
      - name: Install pinned tools
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: gofmt + module tidy + vet + staticcheck + actionlint + shellcheck
        run: scripts/ci/check.sh fmt modtidy vet staticcheck actionlint shellcheck

  # ----------------------------------------------------------------- build
  # Supported Go toolchain matrix (oldest supported per go.mod through the two
  # current stable releases) x GOARCH matrix (amd64 + arm64, cross-compiled).
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', '1.26.x', '1.27.x']
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Build all packages
        run: go build ./...
      - name: Build bfw (linux/${{ matrix.goarch }})
        run: GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -o bfw ./cmd/bfw
      - name: Upload bfw artifact
        # Only the stable/amd64 artifact is consumed by the performance job.
        if: matrix.goarch == 'amd64' && matrix.go == env.GO_STABLE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bfw
          path: bfw
          retention-days: 7

  # ------------------------------------------------------------- unit-test
  # Race-enabled unit tests with coverage; artifacts uploaded for inspection.
  # Tests are dependency-injected — no root, no kernel, no namespaces needed.
  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_STABLE }}
      - name: go test -race -coverprofile
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------ protection benchmarks
  # Keep detector, CrowdSec decoding, and nft set compilation costs visible
  # without touching a live firewall or running the privileged perf harness.
  protection-benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_STABLE }}
      - name: Run protection package tests
        run: go test -race ./internal/protect
      - name: Benchmark protection paths
        run: make benchmark-protect | tee protection-benchmarks.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protection-benchmarks
          path: protection-benchmarks.txt
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ vuln
  # Dependency + stdlib vulnerability scan via govulncheck.
  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_STABLE }}
      - run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - run: scripts/ci/check.sh vuln

  # -------------------------------------------------------------- security
  # CodeQL semantic analysis. Skipped for fork PRs: they get read-only
  # tokens and cannot upload SARIF (the run would fail spuriously).
  security-codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.fork != true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # --------------------------------------------------------------- secrets
  # gitleaks over the full git history of every ref (fetch-depth 0 +
  # --log-opts=--all, not just the pushed commits).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_STABLE }}
      - name: Install pinned gitleaks
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - name: Scan full history for secrets
        run: gitleaks git --redact --verbose --log-opts="--all" .

  # --------------------------------------------------------------- package
  # Staged `make install DESTDIR=…` + systemd-analyze verify of the units.
  # Fully unprivileged: writes only to a mktemp dir, never runs systemctl.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_STABLE }}
      - run: scripts/ci/package.sh

  # ------------------------------------------------------------ integration
  # Real-kernel integration tests (nftables backend, sets, NAT, panic, …)
  # inside disposable net+mount+pid namespaces created by isolate.sh.
  # Anything below runs as root on a throwaway hosted runner only.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_STABLE }}
      - name: Install nftables tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Pre-warm module cache for the isolated step
        # The isolated net namespace has no external connectivity, so all Go
        # modules must already be in the cache (at the same GOMODCACHE the
        # root child will use) before entering.
        env:
          GOCACHE: /tmp/bfw-gocache
          GOPATH: /tmp/bfw-gopath
          GOMODCACHE: /tmp/bfw-gopath/pkg/mod
        run: |
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          go mod download
          chmod -R a+rwX /tmp/bfw-gopath
      - name: Isolated integration tests
        # isolate.sh refuses to run unisolated or outside CI; sudo needs an
        # explicit PATH so `go` (installed under /opt) and go caches are found.
        env:
          GOCACHE: /tmp/bfw-gocache
          GOPATH: /tmp/bfw-gopath
          GOMODCACHE: /tmp/bfw-gopath/pkg/mod
        run: >
          sudo env "PATH=$PATH" "HOME=$HOME" "CI=$CI"
          "GITHUB_ACTIONS=$GITHUB_ACTIONS" "GOCACHE=$GOCACHE" "GOPATH=$GOPATH"
          "GOMODCACHE=$GOMODCACHE"
          scripts/ci/isolate.sh
          go test -count=1 -tags=integration ./tests/... ./internal/backend/nft/...

  # ------------------------------------------------------------ performance
  # Independent rule-cardinality shards run concurrently. Each shard keeps the
  # full traffic-profile/repeat workload; the report job merges raw artifacts.
  performance:
    name: performance (${{ matrix.cardinality }} rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cardinality: [10, 100, 500, 1000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download bfw artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bfw
          path: .
      - run: chmod +x bfw
      - name: Run containerized k6 firewall comparison shard
        env:
          BFW_PERF_RUNNER_ENV: ${{ runner.environment }}
          K6_VERSION: ${{ env.K6_VERSION }}
          PERF_CARDINALITIES: ${{ matrix.cardinality }}
        run: scripts/perf/run.sh
      - name: Upload raw performance shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: better-firewall-performance-raw-${{ matrix.cardinality }}
          path: artifacts/performance/raw/*.json
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ attack
  # Real-attack comparison: nmap recon plus hping3 SYN/connect floods against
  # the service while legit keep-alive traffic runs, for bfw, ufw, and a
  # no-firewall baseline. Kept short (10 rules, 6s floods) so it can run on
  # every push; PERF_ATTACK_* env vars allow deeper manual runs.
  attack:
    name: attack-lab (bfw vs ufw)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download bfw artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bfw
          path: .
      - run: chmod +x bfw
      - name: Run containerized attack comparison
        env:
          BFW_PERF_RUNNER_ENV: ${{ runner.environment }}
        run: scripts/perf/run_attack.sh
      - name: Publish attack-lab report
        if: always()
        run: cat artifacts/attack/attack-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload attack artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: better-firewall-attack
          path: artifacts/attack/**
          if-no-files-found: error
          retention-days: 30

  performance-report:
    name: Consolidate performance report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: performance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download performance shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: better-firewall-performance-raw-*
          path: artifacts/performance/shards
      - name: Merge cardinality shards
        run: >
          python3 scripts/perf/merge_shards.py
          --shards-dir artifacts/performance/shards
          --output-dir artifacts/performance/raw
          --expected-cardinalities 10 100 500 1000
      - name: Generate consolidated comparison
        run: |
          python3 scripts/perf/compare.py \
            --results-dir artifacts/performance/raw \
            --apply-times artifacts/performance/raw/apply_times.json \
            --meta-file artifacts/performance/raw/metadata.json \
            --output-json artifacts/performance/summary.json \
            --output-md artifacts/performance/summary.md \
            --max-error-rate 0.01 \
            --max-p95-latency-ms 500.0
      - name: Publish firewall comparison and resource metrics
        run: cat artifacts/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: better-firewall-performance
          path: artifacts/performance/**
          if-no-files-found: error
          retention-days: 30
