# Attack-lab topology: one defended server, one attacker, one separate
# legitimate client (so dynamic bans of the attacker IP never touch the
# service health stream). Internal-only bridge, no published runner ports.
# NET_ADMIN on the server is confined to the container's own netns; the
# attacker gets NET_RAW (needed by hping3) and nothing else.
services:
  server:
    build:
      context: ../..
      dockerfile: scripts/perf/server-attack.Dockerfile
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      - attacklab
    init: true
    stop_grace_period: 2s

  attacker:
    build:
      context: .
      dockerfile: attacker.Dockerfile
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      - attacklab
    volumes:
      - ./attack_drivers.py:/lab/attack_drivers.py:ro
    depends_on:
      - server

  legit:
    build:
      context: .
      dockerfile: attacker.Dockerfile
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - attacklab
    volumes:
      - ./attack_drivers.py:/lab/attack_drivers.py:ro
    depends_on:
      - server

networks:
  attacklab:
    internal: true
