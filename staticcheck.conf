# bfirewall deliberately mirrors ufw's user-facing error strings, which are
# capitalized ("Bad port", "Invalid port with protocol", "Unsupported
# protocol"). ST1005 demands lowercase error text; satisfying it would break
# ufw output compatibility, so that single check is disabled.
#
# ST1000 (package comment must start "Package x") is also disabled: this
# codebase uses file-scoped doc comments (e.g. "// compile.go translates…")
# and each package already carries a real package comment in one file
# (nft.go, cli.go). Rewording every file header would lose the file-scoped
# descriptions without adding documentation value.
#
# Everything else in the default suite stays enabled.
checks = ["all", "-ST1000", "-ST1005"]
