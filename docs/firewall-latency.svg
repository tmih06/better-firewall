<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">bfw versus UFW p95 latency</title>
  <desc id="desc">Hosted CI p95 latency ratios across keepalive, connection churn, and mixed profiles at 10, 100, 500, and 1,000 rules. Ratio is bfw p95 divided by UFW p95; lower than 1.0 means bfw had lower p95 latency. Ratios range from 0.933 to 1.021.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #fff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .parity { stroke: #334155; stroke-width: 2; stroke-dasharray: 5 4; }
    .keep { fill: #0f9d8a; }
    .churn { fill: #8b5cf6; }
    .mixed { fill: #f97316; }
  </style>
  <rect width="1120" height="650" fill="#f1f5f9"/>
  <text x="32" y="36" font-size="24" font-weight="700">p95 latency: bfw / UFW</text>
  <text x="32" y="60" font-size="13" class="muted">Lower is better · 3 CI repeats · parity at 1.000× · ratio axis</text>
  <rect class="panel" x="24" y="80" width="1072" height="520" rx="14"/>
  <line class="grid" x1="390" y1="130" x2="390" y2="545"/>
  <line class="grid" x1="510" y1="130" x2="510" y2="545"/>
  <line class="grid" x1="630" y1="130" x2="630" y2="545"/>
  <line class="parity" x1="710" y1="125" x2="710" y2="545"/>
  <line class="grid" x1="830" y1="130" x2="830" y2="545"/>
  <line class="grid" x1="950" y1="130" x2="950" y2="545"/>
  <text x="52" y="115" font-size="12" font-weight="650" class="muted">PROFILE · RULES</text>
  <text x="710" y="115" font-size="11" text-anchor="middle" font-weight="650">1.000× PARITY</text>
  <text x="52" y="153" font-size="12" font-weight="650" class="keep">KEEP-ALIVE</text>
  <text x="52" y="177" font-size="12" class="muted">10 rules</text><rect class="keep" x="710" y="164" width="68" height="10" rx="4"/><text x="788" y="174" font-size="12" font-weight="650">1.017×</text>
  <text x="52" y="207" font-size="12" class="muted">100 rules</text><rect class="keep" x="710" y="194" width="56" height="10" rx="4"/><text x="776" y="204" font-size="12" font-weight="650">1.014×</text>
  <text x="52" y="237" font-size="12" class="muted">500 rules</text><rect class="keep" x="698" y="224" width="12" height="10" rx="4"/><text x="720" y="234" font-size="12" font-weight="650">0.997×</text>
  <text x="52" y="267" font-size="12" class="muted">1,000 rules</text><rect class="keep" x="710" y="254" width="8" height="10" rx="4"/><text x="728" y="264" font-size="12" font-weight="650">1.002×</text>
  <text x="52" y="303" font-size="12" font-weight="650" class="churn">CONNECTION CHURN</text>
  <text x="52" y="327" font-size="12" class="muted">10 rules</text><rect class="churn" x="546" y="314" width="164" height="10" rx="4"/><text x="718" y="324" font-size="12" font-weight="650">0.959×</text>
  <text x="52" y="357" font-size="12" class="muted">100 rules</text><rect class="churn" x="442" y="344" width="268" height="10" rx="4"/><text x="718" y="354" font-size="12" font-weight="650">0.933×</text>
  <text x="52" y="387" font-size="12" class="muted">500 rules</text><rect class="churn" x="534" y="374" width="176" height="10" rx="4"/><text x="718" y="384" font-size="12" font-weight="650">0.956×</text>
  <text x="52" y="417" font-size="12" class="muted">1,000 rules</text><rect class="churn" x="710" y="404" width="84" height="10" rx="4"/><text x="802" y="414" font-size="12" font-weight="650">1.021×</text>
  <text x="52" y="453" font-size="12" font-weight="650" class="mixed">MIXED LOAD</text>
  <text x="52" y="477" font-size="12" class="muted">10 rules</text><rect class="mixed" x="710" y="464" width="24" height="10" rx="4"/><text x="742" y="474" font-size="12" font-weight="650">1.006×</text>
  <text x="52" y="507" font-size="12" class="muted">100 rules</text><rect class="mixed" x="710" y="494" width="20" height="10" rx="4"/><text x="738" y="504" font-size="12" font-weight="650">1.005×</text>
  <text x="52" y="537" font-size="12" class="muted">500 rules</text><rect class="mixed" x="582" y="524" width="128" height="10" rx="4"/><text x="718" y="534" font-size="12" font-weight="650">0.968×</text>
  <text x="52" y="567" font-size="12" class="muted">1,000 rules</text><rect class="mixed" x="710" y="554" width="48" height="10" rx="4"/><text x="766" y="564" font-size="12" font-weight="650">1.012×</text>
  <line x1="390" y1="545" x2="950" y2="545" stroke="#94a3b8"/>
  <text x="390" y="570" font-size="11" text-anchor="middle" class="muted">0.920×</text>
  <text x="510" y="570" font-size="11" text-anchor="middle" class="muted">0.950×</text>
  <text x="630" y="570" font-size="11" text-anchor="middle" class="muted">0.980×</text>
  <text x="710" y="570" font-size="11" text-anchor="middle" class="muted">1.000×</text>
  <text x="830" y="570" font-size="11" text-anchor="middle" class="muted">1.030×</text>
  <text x="950" y="570" font-size="11" text-anchor="middle" class="muted">1.060×</text>
</svg>
