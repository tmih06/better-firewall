<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
  <title id="title">Attack lab: bfw vs UFW</title>
  <desc id="desc">Comparison board from the containerized attack-lab CI job. Top panel: nmap recon time over ports 1-2000 and which ports in 8070-8110 answered. Lower panels: legitimate keep-alive HTTP requests completed and their p95 latency while each attack ran against the defended service.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .parity { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
    .peak { fill-opacity: 0.42; }
    .prev { fill: #cbd5e1; }
  </style>
  <rect width="1120" height="850" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Attack lab: bfw vs UFW</text>
  <text x="32" y="62" font-size="13" class="muted">Isolated Docker network · 10 allow rules · 6s per attack · Linux 6.17.0-1022-azure x86_64 · single CI run</text>
  <rect class="panel" x="24" y="104" width="1072" height="150" rx="14"/>
  <text x="48" y="132" font-size="14" font-weight="650">Recon: nmap scan of ports 1–2000 (lower = attacker sees more, faster)</text>
  <text x="48" y="170" font-size="12" font-weight="650">No firewall</text>
  <text x="150" y="170" font-size="11" class="muted">2000 closed; ports 8070–8110: 8080,8081</text>
  <rect x="560" y="156" width="5.3" height="16" rx="4" fill="#64748b"/>
  <text x="573.3" y="169" font-size="11" font-weight="650" fill="#64748b">0.13 s</text>
  <text x="48" y="200" font-size="12" font-weight="650">bfw</text>
  <text x="150" y="200" font-size="11" class="muted">1999 filtered; ports 8070–8110: 8080</text>
  <rect x="560" y="186" width="292.0" height="16" rx="4" fill="#0f9d8a"/>
  <text x="860.0" y="199" font-size="11" font-weight="650" fill="#0f9d8a">7.13 s</text>
  <text x="48" y="230" font-size="12" font-weight="650">UFW</text>
  <text x="150" y="230" font-size="11" class="muted">1999 filtered; ports 8070–8110: 8080</text>
  <rect x="560" y="216" width="295.7" height="16" rx="4" fill="#3b82f6"/>
  <text x="863.7" y="229" font-size="11" font-weight="650" fill="#3b82f6">7.22 s</text>
  <rect class="panel" x="24" y="284" width="1072" height="128" rx="14"/>
  <text x="48" y="310" font-size="14" font-weight="650">SYN flood → denied port — legit requests completed</text>
  <text x="48" y="340" font-size="12" font-weight="650">No firewall</text>
  <rect x="560" y="326" width="288.1" height="16" rx="4" fill="#64748b"/>
  <text x="856.1" y="339" font-size="11" font-weight="650" fill="#64748b">163,056 ok · p95 0.63 ms</text>
  <text x="48" y="368" font-size="12" font-weight="650">bfw</text>
  <rect x="560" y="354" width="257.4" height="16" rx="4" fill="#0f9d8a"/>
  <text x="825.4" y="367" font-size="11" font-weight="650" fill="#0f9d8a">145,646 ok · p95 0.74 ms</text>
  <text x="48" y="396" font-size="12" font-weight="650">UFW</text>
  <rect x="560" y="382" width="272.3" height="16" rx="4" fill="#3b82f6"/>
  <text x="840.3" y="395" font-size="11" font-weight="650" fill="#3b82f6">154,074 ok · p95 0.71 ms</text>
  <rect class="panel" x="24" y="428" width="1072" height="128" rx="14"/>
  <text x="48" y="454" font-size="14" font-weight="650">SYN flood → allowed port — legit requests completed</text>
  <text x="48" y="484" font-size="12" font-weight="650">No firewall</text>
  <rect x="560" y="470" width="288.1" height="16" rx="4" fill="#64748b"/>
  <text x="856.1" y="483" font-size="11" font-weight="650" fill="#64748b">148,100 ok · p95 0.69 ms</text>
  <text x="48" y="512" font-size="12" font-weight="650">bfw</text>
  <rect x="560" y="498" width="283.3" height="16" rx="4" fill="#0f9d8a"/>
  <text x="851.3" y="511" font-size="11" font-weight="650" fill="#0f9d8a">145,602 ok · p95 0.74 ms</text>
  <text x="48" y="540" font-size="12" font-weight="650">UFW</text>
  <rect x="560" y="526" width="282.4" height="16" rx="4" fill="#3b82f6"/>
  <text x="850.4" y="539" font-size="11" font-weight="650" fill="#3b82f6">145,164 ok · p95 0.74 ms</text>
  <rect class="panel" x="24" y="572" width="1072" height="128" rx="14"/>
  <text x="48" y="598" font-size="14" font-weight="650">TCP connect flood → allowed port — legit requests completed</text>
  <text x="48" y="628" font-size="12" font-weight="650">No firewall</text>
  <rect x="560" y="614" width="277.3" height="16" rx="4" fill="#64748b"/>
  <text x="845.3" y="627" font-size="11" font-weight="650" fill="#64748b">126,818 ok · p95 1.24 ms</text>
  <text x="48" y="656" font-size="12" font-weight="650">bfw</text>
  <rect x="560" y="642" width="288.1" height="16" rx="4" fill="#0f9d8a"/>
  <text x="856.1" y="655" font-size="11" font-weight="650" fill="#0f9d8a">131,771 ok · p95 1.09 ms</text>
  <text x="48" y="684" font-size="12" font-weight="650">UFW</text>
  <rect x="560" y="670" width="268.4" height="16" rx="4" fill="#3b82f6"/>
  <text x="836.4" y="683" font-size="11" font-weight="650" fill="#3b82f6">122,735 ok · p95 1.31 ms</text>
  <rect class="panel" x="24" y="722" width="1072" height="110" rx="14"/>
  <text x="48" y="748" font-size="14" font-weight="650">Dynamic bans — bfw protect (journal jail + CrowdSec LAPI)</text>
  <text x="48" y="775" font-size="12" font-weight="650">SSH brute-force → jail ban</text>
  <text x="380" y="775" font-size="11" class="muted">No firewall: no mechanism</text>
  <text x="610" y="775" font-size="11" font-weight="650" fill="#0f9d8a">bfw: ban 0.1 s (ssh blocked)</text>
  <text x="840" y="775" font-size="11" class="muted">UFW: no mechanism</text>
  <text x="48" y="807" font-size="12" font-weight="650">CrowdSec LAPI ban → unban</text>
  <text x="380" y="807" font-size="11" class="muted">No firewall: no mechanism</text>
  <text x="610" y="807" font-size="11" font-weight="650" fill="#0f9d8a">bfw: ban 0.9 s, unban 0.1 s</text>
  <text x="840" y="807" font-size="11" class="muted">UFW: no mechanism</text>
  <rect x="24" y="840" width="12" height="12" rx="3" class="base"/>
  <text x="42" y="850" font-size="11">No firewall</text>
  <rect x="120" y="840" width="12" height="12" rx="3" class="bfw"/>
  <text x="138" y="850" font-size="11">bfw</text>
  <rect x="176" y="840" width="12" height="12" rx="3" class="ufw"/>
  <text x="194" y="850" font-size="11">UFW</text>
  <text x="240" y="850" font-size="10.5" class="muted">Bars: requests completed during the attack window · gates: denied port closed, service reachable, legit p95 &lt; 2 s, attacker banned</text>
</svg>
