<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="824" viewBox="0 0 1120 824" role="img" aria-labelledby="title desc">
  <title id="title">Real attacks: what each firewall actually does</title>
  <desc id="desc">Top panel: nmap recon time over ports 1-2000 and which ports in 8070-8110 answered. Middle panels: legitimate keep-alive requests still served while each attack ran, with their p95 latency. Bottom panel: dynamic ban outcomes, the capability UFW has no mechanism for.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
  </style>
  <rect width="1120" height="824" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Real attacks: what each firewall actually does</text>
  <text x="32" y="62" font-size="13" class="muted">Isolated Docker network &#183; 10 allow rules &#183; 6s per attack &#183; Linux 6.17.0-1022-azure x86_64</text>
  <rect class="panel" x="24" y="100" width="1072" height="136" rx="12"/>
  <text x="48" y="126" font-size="13.5" font-weight="650">Recon: nmap over ports 1-2000 (seconds to scan)</text>
  <text x="48" y="157" font-size="12" font-weight="650">No firewall</text>
  <text x="140" y="157" font-size="10.5" class="muted">2000 closed; ports 8070-8110: 8080,8081</text>
  <rect x="400" y="144" width="8.6" height="16" rx="4" fill="#64748b"/>
  <text x="416.6" y="157" font-size="11" font-weight="650" fill="#64748b">0.13 s</text>
  <text x="48" y="185" font-size="12" font-weight="650">bfw</text>
  <text x="140" y="185" font-size="10.5" class="muted">1999 filtered; ports 8070-8110: 8080</text>
  <rect x="400" y="172" width="472.6" height="16" rx="4" fill="#0f9d8a"/>
  <text x="880.6" y="185" font-size="11" font-weight="650" fill="#0f9d8a">7.13 s</text>
  <text x="48" y="213" font-size="12" font-weight="650">UFW</text>
  <text x="140" y="213" font-size="10.5" class="muted">1999 filtered; ports 8070-8110: 8080</text>
  <rect x="400" y="200" width="478.6" height="16" rx="4" fill="#3b82f6"/>
  <text x="886.6" y="213" font-size="11" font-weight="650" fill="#3b82f6">7.22 s</text>
  <rect class="panel" x="24" y="252" width="1072" height="110" rx="12"/>
  <text x="48" y="276" font-size="13.5" font-weight="650">SYN flood to a denied port</text>
  <text x="1072" y="276" text-anchor="end" font-size="10.5" class="muted">Legitimate requests still served</text>
  <text x="48" y="301" font-size="11.5" font-weight="650">No firewall</text>
  <rect x="150" y="288" width="677.6" height="15" rx="4" fill="#64748b"/>
  <text x="835.6" y="301" font-size="10.5" font-weight="650" fill="#64748b">163,056 ok &#183; p95 0.63 ms</text>
  <text x="48" y="325" font-size="11.5" font-weight="650">bfw</text>
  <rect x="150" y="312" width="605.2" height="15" rx="4" fill="#0f9d8a"/>
  <text x="763.2" y="325" font-size="10.5" font-weight="650" fill="#0f9d8a">145,646 ok &#183; p95 0.74 ms</text>
  <text x="48" y="349" font-size="11.5" font-weight="650">UFW</text>
  <rect x="150" y="336" width="640.3" height="15" rx="4" fill="#3b82f6"/>
  <text x="798.3" y="349" font-size="10.5" font-weight="650" fill="#3b82f6">154,074 ok &#183; p95 0.71 ms</text>
  <rect class="panel" x="24" y="378" width="1072" height="110" rx="12"/>
  <text x="48" y="402" font-size="13.5" font-weight="650">SYN flood to an allowed port</text>
  <text x="1072" y="402" text-anchor="end" font-size="10.5" class="muted">Legitimate requests still served</text>
  <text x="48" y="427" font-size="11.5" font-weight="650">No firewall</text>
  <rect x="150" y="414" width="677.6" height="15" rx="4" fill="#64748b"/>
  <text x="835.6" y="427" font-size="10.5" font-weight="650" fill="#64748b">148,100 ok &#183; p95 0.69 ms</text>
  <text x="48" y="451" font-size="11.5" font-weight="650">bfw</text>
  <rect x="150" y="438" width="666.2" height="15" rx="4" fill="#0f9d8a"/>
  <text x="824.2" y="451" font-size="10.5" font-weight="650" fill="#0f9d8a">145,602 ok &#183; p95 0.74 ms</text>
  <text x="48" y="475" font-size="11.5" font-weight="650">UFW</text>
  <rect x="150" y="462" width="664.2" height="15" rx="4" fill="#3b82f6"/>
  <text x="822.2" y="475" font-size="10.5" font-weight="650" fill="#3b82f6">145,164 ok &#183; p95 0.74 ms</text>
  <rect class="panel" x="24" y="504" width="1072" height="110" rx="12"/>
  <text x="48" y="528" font-size="13.5" font-weight="650">TCP connect flood to an allowed port</text>
  <text x="1072" y="528" text-anchor="end" font-size="10.5" class="muted">Legitimate requests still served</text>
  <text x="48" y="553" font-size="11.5" font-weight="650">No firewall</text>
  <rect x="150" y="540" width="652.1" height="15" rx="4" fill="#64748b"/>
  <text x="810.1" y="553" font-size="10.5" font-weight="650" fill="#64748b">126,818 ok &#183; p95 1.24 ms</text>
  <text x="48" y="577" font-size="11.5" font-weight="650">bfw</text>
  <rect x="150" y="564" width="677.6" height="15" rx="4" fill="#0f9d8a"/>
  <text x="835.6" y="577" font-size="10.5" font-weight="650" fill="#0f9d8a">131,771 ok &#183; p95 1.09 ms</text>
  <text x="48" y="601" font-size="11.5" font-weight="650">UFW</text>
  <rect x="150" y="588" width="631.1" height="15" rx="4" fill="#3b82f6"/>
  <text x="789.1" y="601" font-size="10.5" font-weight="650" fill="#3b82f6">122,735 ok &#183; p95 1.31 ms</text>
  <rect class="panel" x="24" y="632" width="1072" height="112" rx="12"/>
  <text x="48" y="656" font-size="13.5" font-weight="650">Dynamic bans &#8212; the capability UFW has no mechanism for</text>
  <text x="48" y="693" font-size="11.5" font-weight="650">SSH brute-force, 12 tries</text>
  <text x="372" y="693" font-size="11" class="muted">No firewall: not available</text>
  <text x="598" y="693" font-size="11" font-weight="650" fill="#0f9d8a">bfw: ban 0.1 s, SSH blocked</text>
  <text x="824" y="693" font-size="11" class="muted">UFW: not available</text>
  <text x="48" y="723" font-size="11.5" font-weight="650">CrowdSec LAPI ban, then unban</text>
  <text x="372" y="723" font-size="11" class="muted">No firewall: not available</text>
  <text x="598" y="723" font-size="11" font-weight="650" fill="#0f9d8a">bfw: ban 0.9 s, unban 0.1 s</text>
  <text x="824" y="723" font-size="11" class="muted">UFW: not available</text>
  <rect x="24" y="762" width="12" height="12" rx="3" class="base"/>
  <text x="42" y="772" font-size="11.5">No firewall</text>
  <rect x="126.6" y="762" width="12" height="12" rx="3" class="bfw"/>
  <text x="144.6" y="772" font-size="11.5">bfw</text>
  <rect x="176.39999999999998" y="762" width="12" height="12" rx="3" class="ufw"/>
  <text x="194.39999999999998" y="772" font-size="11.5">UFW</text>
  <text x="242.2" y="772" font-size="10.5" class="muted">Bars: legitimate requests completed during the attack window.</text>
  <text x="24" y="794" font-size="10.5" class="muted">Gates asserted by the job: denied port stays closed, legitimate service stays reachable, legitimate p95 stays under 2 s, attacker ends up banned.</text>
</svg>
