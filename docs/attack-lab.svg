<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Attack lab: bfw vs UFW</title>
  <desc id="desc">Comparison board from the containerized attack-lab CI job. Top panel: nmap recon time over ports 1-2000 and which ports in 8070-8110 answered. Lower panels: legitimate keep-alive HTTP requests completed and their p95 latency while each attack ran against the defended service.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .parity { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
    .peak { fill-opacity: 0.42; }
    .prev { fill: #cbd5e1; }
  </style>
  <rect width="1120" height="700" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Attack lab: bfw vs UFW</text>
  <text x="32" y="62" font-size="13" class="muted">Isolated Docker network · 10 allow rules · 6s per attack · Linux 6.17.0-1022-azure x86_64 · single CI run</text>
  <rect class="panel" x="24" y="104" width="1072" height="150" rx="14"/>
  <text x="48" y="132" font-size="14" font-weight="650">Recon: nmap scan of ports 1–2000 (lower = attacker sees more, faster)</text>
  <text x="48" y="170" font-size="12" font-weight="650">No firewall</text>
  <text x="150" y="170" font-size="11" class="muted">2000 closed; ports 8070–8110: none open</text>
  <rect x="560" y="156" width="1.2" height="16" rx="4" fill="#64748b"/>
  <text x="569.2" y="169" font-size="11" font-weight="650" fill="#64748b">n/a</text>
  <text x="48" y="200" font-size="12" font-weight="650">bfw</text>
  <text x="150" y="200" font-size="11" class="muted">2000 filtered; ports 8070–8110: none open</text>
  <rect x="560" y="186" width="1.2" height="16" rx="4" fill="#0f9d8a"/>
  <text x="569.2" y="199" font-size="11" font-weight="650" fill="#0f9d8a">n/a</text>
  <text x="48" y="230" font-size="12" font-weight="650">UFW</text>
  <text x="150" y="230" font-size="11" class="muted">2000 filtered; ports 8070–8110: none open</text>
  <rect x="560" y="216" width="1.2" height="16" rx="4" fill="#3b82f6"/>
  <text x="569.2" y="229" font-size="11" font-weight="650" fill="#3b82f6">n/a</text>
  <rect class="panel" x="24" y="284" width="1072" height="128" rx="14"/>
  <text x="48" y="310" font-size="14" font-weight="650">SYN flood → denied port — legit requests completed</text>
  <text x="48" y="340" font-size="12" font-weight="650">No firewall</text>
  <rect x="560" y="326" width="288.1" height="16" rx="4" fill="#64748b"/>
  <text x="856.1" y="339" font-size="11" font-weight="650" fill="#64748b">87,166 ok · p95 1.35 ms</text>
  <text x="48" y="368" font-size="12" font-weight="650">bfw</text>
  <rect x="560" y="354" width="282.8" height="16" rx="4" fill="#0f9d8a"/>
  <text x="850.8" y="367" font-size="11" font-weight="650" fill="#0f9d8a">85,537 ok · p95 1.21 ms</text>
  <text x="48" y="396" font-size="12" font-weight="650">UFW</text>
  <rect x="560" y="382" width="279.9" height="16" rx="4" fill="#3b82f6"/>
  <text x="847.9" y="395" font-size="11" font-weight="650" fill="#3b82f6">84,677 ok · p95 1.31 ms</text>
  <rect class="panel" x="24" y="428" width="1072" height="128" rx="14"/>
  <text x="48" y="454" font-size="14" font-weight="650">SYN flood → allowed port — legit requests completed</text>
  <text x="48" y="484" font-size="12" font-weight="650">No firewall</text>
  <rect x="560" y="470" width="288.1" height="16" rx="4" fill="#64748b"/>
  <text x="856.1" y="483" font-size="11" font-weight="650" fill="#64748b">101,598 ok · p95 0.99 ms</text>
  <text x="48" y="512" font-size="12" font-weight="650">bfw</text>
  <rect x="560" y="498" width="245.5" height="16" rx="4" fill="#0f9d8a"/>
  <text x="813.5" y="511" font-size="11" font-weight="650" fill="#0f9d8a">86,547 ok · p95 1.26 ms</text>
  <text x="48" y="540" font-size="12" font-weight="650">UFW</text>
  <rect x="560" y="526" width="268.4" height="16" rx="4" fill="#3b82f6"/>
  <text x="836.4" y="539" font-size="11" font-weight="650" fill="#3b82f6">94,633 ok · p95 1.21 ms</text>
  <rect class="panel" x="24" y="572" width="1072" height="128" rx="14"/>
  <text x="48" y="598" font-size="14" font-weight="650">TCP connect flood → allowed port — legit requests completed</text>
  <text x="48" y="628" font-size="12" font-weight="650">No firewall</text>
  <rect x="560" y="614" width="288.1" height="16" rx="4" fill="#64748b"/>
  <text x="856.1" y="627" font-size="11" font-weight="650" fill="#64748b">77,038 ok · p95 2.29 ms</text>
  <text x="48" y="656" font-size="12" font-weight="650">bfw</text>
  <rect x="560" y="642" width="256.2" height="16" rx="4" fill="#0f9d8a"/>
  <text x="824.2" y="655" font-size="11" font-weight="650" fill="#0f9d8a">68,511 ok · p95 2.42 ms</text>
  <text x="48" y="684" font-size="12" font-weight="650">UFW</text>
  <rect x="560" y="670" width="260.5" height="16" rx="4" fill="#3b82f6"/>
  <text x="828.5" y="683" font-size="11" font-weight="650" fill="#3b82f6">69,642 ok · p95 2.36 ms</text>
  <rect x="24" y="700" width="12" height="12" rx="3" class="base"/>
  <text x="42" y="710" font-size="11">No firewall</text>
  <rect x="120" y="700" width="12" height="12" rx="3" class="bfw"/>
  <text x="138" y="710" font-size="11">bfw</text>
  <rect x="176" y="700" width="12" height="12" rx="3" class="ufw"/>
  <text x="194" y="710" font-size="11">UFW</text>
  <text x="240" y="710" font-size="10.5" class="muted">Bars: requests completed during the attack window · gates: denied port closed, service reachable, legit p95 &lt; 2 s</text>
</svg>
