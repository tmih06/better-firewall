<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">Protection microbenchmark results</title>
  <desc id="desc">On Linux arm64 with Go 1.27.0, journal failure detection averaged 1.762 microseconds per event, decoding 100 CrowdSec decisions averaged 142.504 microseconds per response, and compiling nft threat-ban sets took 0.248 milliseconds for 100 bans, 1.225 milliseconds for 1,000 bans, and 11.594 milliseconds for 10,000 bans.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .bar-a { fill: #0f9d8a; }
    .bar-b { fill: #3b82f6; }
    .bar-c { fill: #f97316; }
  </style>
  <rect width="1000" height="690" fill="#f1f5f9"/>
  <text x="36" y="38" font-size="25" font-weight="700">Protection benchmarks</text>
  <text x="36" y="61" font-size="13" class="muted">Go 1.27.0 · Linux arm64 · make benchmark-protect · ns/op and -benchmem</text>

  <rect class="panel" x="28" y="80" width="944" height="242" rx="14"/>
  <text x="54" y="116" font-size="18" font-weight="650">Detection and decision decoding</text>
  <text x="54" y="138" font-size="12" class="muted">Microseconds per operation · same scale, different workloads</text>
  <text x="54" y="174" font-size="14" font-weight="600">Journal detector</text>
  <text x="54" y="191" font-size="11" class="muted">one failed-login event</text>
  <text x="54" y="224" font-size="14" font-weight="600">CrowdSec decode</text>
  <text x="54" y="241" font-size="11" class="muted">one JSON response, 100 decisions</text>
  <line class="grid" x1="350" y1="150" x2="350" y2="258"/>
  <line class="grid" x1="480" y1="150" x2="480" y2="258"/>
  <line class="grid" x1="610" y1="150" x2="610" y2="258"/>
  <line class="grid" x1="740" y1="150" x2="740" y2="258"/>
  <line class="grid" x1="870" y1="150" x2="870" y2="258"/>
  <rect class="bar-a" x="350" y="160" width="5.73" height="18" rx="4"/>
  <text x="365" y="174" font-size="13" font-weight="650">1.762 µs</text>
  <rect class="bar-b" x="350" y="210" width="463.14" height="18" rx="4"/>
  <text x="823" y="224" font-size="13" font-weight="650">142.504 µs</text>
  <line class="axis" x1="350" y1="258" x2="870" y2="258"/>
  <text x="350" y="278" font-size="11" text-anchor="middle" class="muted">0</text>
  <text x="480" y="278" font-size="11" text-anchor="middle" class="muted">40</text>
  <text x="610" y="278" font-size="11" text-anchor="middle" class="muted">80</text>
  <text x="740" y="278" font-size="11" text-anchor="middle" class="muted">120</text>
  <text x="870" y="278" font-size="11" text-anchor="middle" class="muted">160 µs</text>

  <rect class="panel" x="28" y="338" width="944" height="292" rx="14"/>
  <text x="54" y="374" font-size="18" font-weight="650">nft threat-ban set compilation</text>
  <text x="54" y="396" font-size="12" class="muted">Elapsed milliseconds per compile · increasing ban count</text>
  <text x="54" y="444" font-size="14" font-weight="600">100 bans</text>
  <text x="54" y="494" font-size="14" font-weight="600">1,000 bans</text>
  <text x="54" y="544" font-size="14" font-weight="600">10,000 bans</text>
  <line class="grid" x1="350" y1="410" x2="350" y2="570"/>
  <line class="grid" x1="523.33" y1="410" x2="523.33" y2="570"/>
  <line class="grid" x1="696.67" y1="410" x2="696.67" y2="570"/>
  <line class="grid" x1="870" y1="410" x2="870" y2="570"/>
  <rect class="bar-a" x="350" y="430" width="8.60" height="18" rx="4"/>
  <text x="368" y="444" font-size="13" font-weight="650">0.248 ms</text>
  <rect class="bar-b" x="350" y="480" width="42.48" height="18" rx="4"/>
  <text x="402" y="494" font-size="13" font-weight="650">1.225 ms</text>
  <rect class="bar-c" x="350" y="530" width="401.66" height="18" rx="4"/>
  <text x="760" y="544" font-size="13" font-weight="650">11.594 ms</text>
  <line class="axis" x1="350" y1="570" x2="870" y2="570"/>
  <text x="350" y="590" font-size="11" text-anchor="middle" class="muted">0</text>
  <text x="523.33" y="590" font-size="11" text-anchor="middle" class="muted">5</text>
  <text x="696.67" y="590" font-size="11" text-anchor="middle" class="muted">10</text>
  <text x="870" y="590" font-size="11" text-anchor="middle" class="muted">15 ms</text>
  <text x="54" y="610" font-size="11" class="muted">Microbenchmarks only; not packet throughput or an UFW comparison.</text>
</svg>
