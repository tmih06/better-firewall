<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Protection benchmark latency</title>
  <desc id="desc">Log-scale latency for every protection benchmark: journal detection 1.810 microseconds; CrowdSec decoding 100 decisions 140.668 microseconds; nft threat-set compilation 218.293 microseconds for 100 bans, 0.995 milliseconds for 1,000 bans, and 14.535 milliseconds for 10,000 bans.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #fff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .detector { fill: #0f9d8a; }
    .crowdsec { fill: #3b82f6; }
    .ban100 { fill: #8b5cf6; }
    .ban1000 { fill: #f59e0b; }
    .ban10000 { fill: #ef4444; }
  </style>
  <rect width="1120" height="470" fill="#f1f5f9"/>
  <text x="32" y="36" font-size="24" font-weight="700">Latency per operation</text>
  <text x="32" y="60" font-size="13" class="muted">Five benchmark cases · logarithmic x-axis · Linux arm64, Go 1.27.0</text>
  <rect class="panel" x="24" y="80" width="1072" height="365" rx="14"/>
  <text x="52" y="110" font-size="15" font-weight="650">Lower is faster</text>
  <text x="52" y="130" font-size="11" class="muted">Time per operation</text>
  <line class="grid" x1="350" y1="138" x2="350" y2="402"/>
  <line class="grid" x1="470" y1="138" x2="470" y2="402"/>
  <line class="grid" x1="590" y1="138" x2="590" y2="402"/>
  <line class="grid" x1="710" y1="138" x2="710" y2="402"/>
  <line class="grid" x1="830" y1="138" x2="830" y2="402"/>
  <line class="grid" x1="950" y1="138" x2="950" y2="402"/>
  <text x="52" y="160" font-size="13" font-weight="650">Journal detector</text><text x="52" y="177" font-size="11" class="muted">one failed-login event</text>
  <rect class="detector" x="350" y="145" width="30.92" height="18" rx="4"/><text x="389" y="160" font-size="12" font-weight="650">1.810 µs</text>
  <text x="52" y="210" font-size="13" font-weight="650">CrowdSec decode</text><text x="52" y="227" font-size="11" class="muted">100 decisions per response</text>
  <rect class="crowdsec" x="350" y="195" width="257.80" height="18" rx="4"/><text x="616" y="210" font-size="12" font-weight="650">140.668 µs</text>
  <text x="52" y="260" font-size="13" font-weight="650">nft set compile · 100</text><text x="52" y="277" font-size="11" class="muted">bans</text>
  <rect class="ban100" x="350" y="245" width="280.68" height="18" rx="4"/><text x="639" y="260" font-size="12" font-weight="650">218.293 µs</text>
  <text x="52" y="310" font-size="13" font-weight="650">nft set compile · 1,000</text><text x="52" y="327" font-size="11" class="muted">bans</text>
  <rect class="ban1000" x="350" y="295" width="359.72" height="18" rx="4"/><text x="718" y="310" font-size="12" font-weight="650">0.995 ms</text>
  <text x="52" y="360" font-size="13" font-weight="650">nft set compile · 10,000</text><text x="52" y="377" font-size="11" class="muted">bans</text>
  <rect class="ban10000" x="350" y="345" width="499.48" height="18" rx="4"/><text x="858" y="360" font-size="12" font-weight="650">14.535 ms</text>
  <line class="axis" x1="350" y1="402" x2="950" y2="402"/>
  <text x="350" y="424" font-size="11" text-anchor="middle" class="muted">1 µs</text>
  <text x="470" y="424" font-size="11" text-anchor="middle" class="muted">10 µs</text>
  <text x="590" y="424" font-size="11" text-anchor="middle" class="muted">100 µs</text>
  <text x="710" y="424" font-size="11" text-anchor="middle" class="muted">1 ms</text>
  <text x="830" y="424" font-size="11" text-anchor="middle" class="muted">10 ms</text>
  <text x="950" y="424" font-size="11" text-anchor="middle" class="muted">100 ms</text>
</svg>
