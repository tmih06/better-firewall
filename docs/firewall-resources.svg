<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Defender CPU and memory across firewall rule counts</title>
  <desc id="desc">Line graphs of average server-container CPU and memory during the mixed traffic profile at 10, 100, 500, and 1,000 rules. Separate lines show no firewall, bfw, and UFW. CPU percentages are 74.61, 77.03, 76.73, 81.29 for no firewall; 74.57, 72.54, 76.70, 76.57 for bfw; 72.25, 73.00, 75.78, 72.32 for UFW. Average memory in MiB is 18.49, 19.08, 21.88, 26.24; 18.87, 20.38, 24.54, 29.69; and 19.14, 20.48, 25.97, 34.22 respectively.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #fff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1120" height="560" fill="#f1f5f9"/>
  <text x="32" y="36" font-size="24" font-weight="700">Defender resources · mixed traffic</text>
  <text x="32" y="60" font-size="13" class="muted">Average server-container usage by rule count · one-second samples</text>
  <rect class="panel" x="24" y="80" width="1072" height="440" rx="14"/>
  <text x="68" y="115" font-size="16" font-weight="650">CPU average (%)</text>
  <text x="608" y="115" font-size="16" font-weight="650">Memory average (MiB)</text>
  <line class="grid" x1="190" y1="140" x2="510" y2="140"/><line class="grid" x1="190" y1="212.5" x2="510" y2="212.5"/><line class="grid" x1="190" y1="285" x2="510" y2="285"/><line class="grid" x1="190" y1="357.5" x2="510" y2="357.5"/><line class="grid" x1="190" y1="430" x2="510" y2="430"/>
  <text x="178" y="144" text-anchor="end" font-size="10" class="muted">85</text><text x="178" y="216.5" text-anchor="end" font-size="10" class="muted">80</text><text x="178" y="289" text-anchor="end" font-size="10" class="muted">75</text><text x="178" y="361.5" text-anchor="end" font-size="10" class="muted">70</text><text x="178" y="434" text-anchor="end" font-size="10" class="muted">65</text>
  <line class="grid" x1="700" y1="140" x2="1020" y2="140"/><line class="grid" x1="700" y1="198" x2="1020" y2="198"/><line class="grid" x1="700" y1="256" x2="1020" y2="256"/><line class="grid" x1="700" y1="314" x2="1020" y2="314"/><line class="grid" x1="700" y1="372" x2="1020" y2="372"/><line class="grid" x1="700" y1="430" x2="1020" y2="430"/>
  <text x="688" y="144" text-anchor="end" font-size="10" class="muted">40</text><text x="688" y="202" text-anchor="end" font-size="10" class="muted">35</text><text x="688" y="260" text-anchor="end" font-size="10" class="muted">30</text><text x="688" y="318" text-anchor="end" font-size="10" class="muted">25</text><text x="688" y="376" text-anchor="end" font-size="10" class="muted">20</text><text x="688" y="434" text-anchor="end" font-size="10" class="muted">15</text>
