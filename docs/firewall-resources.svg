<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="726" viewBox="0 0 1120 726" role="img" aria-labelledby="title desc">
  <title id="title">Less memory as the ruleset grows, same CPU</title>
  <desc id="desc">Two panels of grouped bars against rule count. The upper panel shows mean resident memory in mebibytes for the defended container under each engine. bfw and UFW are level at 10 rules and bfw pulls about 14 percent ahead by 1,000 rules, consistently across all three traffic profiles. The lower panel shows mean CPU overhead above the no-firewall container, in percentage points, because absolute CPU is dominated by the traffic profile. Both engines sit within about two percentage points of the no-firewall baseline and bfw's figure changes sign between rule counts, so CPU is a tie.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
  </style>
  <rect width="1120" height="726" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Less memory as the ruleset grows, same CPU</text>
  <text x="32" y="62" font-size="13" class="muted">Defender container &#183; mean over 3 repeats and 3 profiles &#183; Linux 6.17.0-1022-azure x86_64</text>
  <rect class="panel" x="24" y="92" width="1072" height="250" rx="12"/>
  <text x="48" y="118" font-size="13.5" font-weight="650">Mean resident memory (MiB, lower is better)</text>
  <line class="grid" x1="196" y1="302.0" x2="1072" y2="302.0"/>
  <text x="186" y="306.0" text-anchor="end" font-size="10" class="muted">0</text>
  <line class="grid" x1="196" y1="260.5" x2="1072" y2="260.5"/>
  <text x="186" y="264.5" text-anchor="end" font-size="10" class="muted">10</text>
  <line class="grid" x1="196" y1="219.0" x2="1072" y2="219.0"/>
  <text x="186" y="223.0" text-anchor="end" font-size="10" class="muted">20</text>
  <line class="grid" x1="196" y1="177.5" x2="1072" y2="177.5"/>
  <text x="186" y="181.5" text-anchor="end" font-size="10" class="muted">30</text>
  <line class="grid" x1="196" y1="136.0" x2="1072" y2="136.0"/>
  <text x="186" y="140.0" text-anchor="end" font-size="10" class="muted">40</text>
  <line class="axis" x1="196" y1="302" x2="1072" y2="302"/>
  <rect class="base" x="214.0" y="224.7" width="48" height="77.3" rx="3"><title>No firewall, 10 rules: 18.63 MiB mean resident</title></rect>
  <text x="238.0" y="219.7" text-anchor="middle" font-size="9.5" font-weight="650" fill="#64748b">18.6</text>
  <rect class="bfw" x="268.0" y="225.4" width="48" height="76.6" rx="3"><title>bfw, 10 rules: 18.46 MiB mean resident</title></rect>
  <text x="292.0" y="220.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">18.5</text>
  <rect class="ufw" x="322.0" y="225.1" width="48" height="76.9" rx="3"><title>UFW, 10 rules: 18.53 MiB mean resident</title></rect>
  <text x="346.0" y="220.1" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">18.5</text>
  <text x="292.0" y="318.0" text-anchor="middle" font-size="11" class="muted">10 rules</text>
  <rect class="base" x="458.0" y="223.8" width="48" height="78.2" rx="3"><title>No firewall, 100 rules: 18.85 MiB mean resident</title></rect>
  <text x="482.0" y="218.8" text-anchor="middle" font-size="9.5" font-weight="650" fill="#64748b">18.8</text>
  <rect class="bfw" x="512.0" y="219.6" width="48" height="82.4" rx="3"><title>bfw, 100 rules: 19.86 MiB mean resident</title></rect>
  <text x="536.0" y="214.6" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">19.9</text>
  <rect class="ufw" x="566.0" y="217.9" width="48" height="84.1" rx="3"><title>UFW, 100 rules: 20.27 MiB mean resident</title></rect>
  <text x="590.0" y="212.9" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">20.3</text>
  <text x="536.0" y="318.0" text-anchor="middle" font-size="11" class="muted">100 rules</text>
  <rect class="base" x="702.0" y="211.3" width="48" height="90.7" rx="3"><title>No firewall, 500 rules: 21.86 MiB mean resident</title></rect>
  <text x="726.0" y="206.3" text-anchor="middle" font-size="9.5" font-weight="650" fill="#64748b">21.9</text>
  <rect class="bfw" x="756.0" y="204.6" width="48" height="97.4" rx="3"><title>bfw, 500 rules: 23.46 MiB mean resident</title></rect>
  <text x="780.0" y="199.6" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">23.5</text>
  <rect class="ufw" x="810.0" y="193.6" width="48" height="108.4" rx="3"><title>UFW, 500 rules: 26.11 MiB mean resident</title></rect>
  <text x="834.0" y="188.6" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">26.1</text>
  <text x="780.0" y="318.0" text-anchor="middle" font-size="11" class="muted">500 rules</text>
  <rect class="base" x="946.0" y="195.4" width="48" height="106.6" rx="3"><title>No firewall, 1,000 rules: 25.69 MiB mean resident</title></rect>
  <text x="970.0" y="190.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#64748b">25.7</text>
  <rect class="bfw" x="1000.0" y="182.4" width="48" height="119.6" rx="3"><title>bfw, 1,000 rules: 28.82 MiB mean resident</title></rect>
  <text x="1024.0" y="177.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">28.8</text>
  <rect class="ufw" x="1054.0" y="162.6" width="48" height="139.4" rx="3"><title>UFW, 1,000 rules: 33.58 MiB mean resident</title></rect>
  <text x="1078.0" y="157.6" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">33.6</text>
  <text x="1024.0" y="318.0" text-anchor="middle" font-size="11" class="muted">1,000 rules</text>
  <text x="48" y="332" font-size="10.5" class="muted">Lower is better.</text>
  <rect class="panel" x="24" y="366" width="1072" height="250" rx="12"/>
  <text x="48" y="392" font-size="13.5" font-weight="650">CPU overhead above the no-firewall container (percentage points)</text>
  <line class="grid" x1="196" y1="576.0" x2="1072" y2="576.0"/>
  <text x="186" y="580.0" text-anchor="end" font-size="10" class="muted">-4</text>
  <line class="grid" x1="196" y1="539.6" x2="1072" y2="539.6"/>
  <text x="186" y="543.6" text-anchor="end" font-size="10" class="muted">-2</text>
  <line class="grid" x1="196" y1="503.1" x2="1072" y2="503.1"/>
  <text x="186" y="507.1" text-anchor="end" font-size="10" class="muted">+0</text>
  <line class="grid" x1="196" y1="466.7" x2="1072" y2="466.7"/>
  <text x="186" y="470.7" text-anchor="end" font-size="10" class="muted">+2</text>
  <line class="grid" x1="196" y1="412.0" x2="1072" y2="412.0"/>
  <text x="186" y="416.0" text-anchor="end" font-size="10" class="muted">+5</text>
  <line class="axis" x1="196" y1="503.1" x2="1072" y2="503.1"/>
  <circle cx="280" cy="483.6" r="6" fill="#0f9d8a"><title>bfw, 10 rules: +1.07 pp above no firewall</title></circle>
  <text x="280" y="471.6" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">+1.1</text>
  <circle cx="304" cy="453.9" r="6" fill="#3b82f6"><title>UFW, 10 rules: +2.70 pp above no firewall</title></circle>
  <text x="304" y="441.9" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">+2.7</text>
  <text x="292.0" y="596.0" text-anchor="middle" font-size="11" class="muted">10 rules</text>
  <circle cx="524" cy="471.4" r="6" fill="#0f9d8a"><title>bfw, 100 rules: +1.74 pp above no firewall</title></circle>
  <text x="524" y="459.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">+1.7</text>
  <circle cx="548" cy="491.2" r="6" fill="#3b82f6"><title>UFW, 100 rules: +0.65 pp above no firewall</title></circle>
  <text x="548" y="479.2" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">+0.7</text>
  <text x="536.0" y="596.0" text-anchor="middle" font-size="11" class="muted">100 rules</text>
  <circle cx="768" cy="536.0" r="6" fill="#0f9d8a"><title>bfw, 500 rules: -1.80 pp above no firewall</title></circle>
  <text x="768" y="556.0" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">-1.8</text>
  <circle cx="792" cy="434.4" r="6" fill="#3b82f6"><title>UFW, 500 rules: +3.77 pp above no firewall</title></circle>
  <text x="792" y="422.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">+3.8</text>
  <text x="780.0" y="596.0" text-anchor="middle" font-size="11" class="muted">500 rules</text>
  <circle cx="1012" cy="505.4" r="6" fill="#0f9d8a"><title>bfw, 1,000 rules: -0.12 pp above no firewall</title></circle>
  <text x="1012" y="525.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#0f9d8a">-0.1</text>
  <circle cx="1036" cy="527.4" r="6" fill="#3b82f6"><title>UFW, 1,000 rules: -1.33 pp above no firewall</title></circle>
  <text x="1036" y="547.4" text-anchor="middle" font-size="9.5" font-weight="650" fill="#3b82f6">-1.3</text>
  <text x="1024.0" y="596.0" text-anchor="middle" font-size="11" class="muted">1,000 rules</text>
  <text x="48" y="606" font-size="10.5" class="muted">Zero means identical to running no firewall at all.</text>
  <text x="24" y="648" font-size="10.5" class="muted">Both panels are the defended container under load; the no-firewall bars are the same container with no ruleset loaded.</text>
  <text x="24" y="666" font-size="10.5" class="muted">Memory is a mean of the three traffic profiles. At 1,000 rules bfw is 14.0%, 13.9% and 14.6% below UFW in the keep-alive, churn and mixed profiles individually.</text>
  <text x="24" y="684" font-size="10.5" class="muted">CPU is the mean percentage points above the no-firewall container. Both engines stay within about two points of it and bfw changes sign between rule counts, so it supports no claim either way.</text>
  <rect x="24" y="700" width="12" height="12" rx="3" class="base"/>
  <text x="42" y="710" font-size="11.5">No firewall</text>
  <rect x="126.6" y="700" width="12" height="12" rx="3" class="bfw"/>
  <text x="144.6" y="710" font-size="11.5">bfw</text>
  <rect x="176.39999999999998" y="700" width="12" height="12" rx="3" class="ufw"/>
  <text x="194.39999999999998" y="710" font-size="11.5">UFW</text>
</svg>
