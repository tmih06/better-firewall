  <text x="710" y="451" text-anchor="middle" font-size="10" class="muted">10</text><text x="810" y="451" text-anchor="middle" font-size="10" class="muted">100</text><text x="910" y="451" text-anchor="middle" font-size="10" class="muted">500</text><text x="1010" y="451" text-anchor="middle" font-size="10" class="muted">1,000</text>
  <line x1="345" y1="485" x2="371" y2="485" stroke="#64748b" stroke-width="3"/><circle cx="358" cy="485" r="4" fill="#64748b"/><text x="380" y="489" font-size="11">No firewall</text>
  <line x1="493" y1="485" x2="519" y2="485" stroke="#0f9d8a" stroke-width="3"/><circle cx="506" cy="485" r="4" fill="#0f9d8a"/><text x="528" y="489" font-size="11">bfw</text>
  <line x1="600" y1="485" x2="626" y2="485" stroke="#3b82f6" stroke-width="3"/><circle cx="613" cy="485" r="4" fill="#3b82f6"/><text x="635" y="489" font-size="11">UFW</text>
  <text x="68" y="512" font-size="10" class="muted">Y-axes are zoomed to show differences: CPU 65–85%; memory 15–40 MiB. One hosted-run sample; noisy, report-only.</text>
</svg>
