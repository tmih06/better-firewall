<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="826" viewBox="0 0 1120 826" role="img" aria-labelledby="title desc">
  <title id="title">Protection path cost per operation</title>
  <desc id="desc">Three dot-plot panels, one per measure, on a linear axis running from zero. The time panel shows time per operation, the memory panel shows heap bytes per operation, and the allocations panel shows heap allocation count per operation, for journal failure detection, CrowdSec decision decoding, and nft ban-set compilation at 100, 1,000, and 10,000 bans. Dots mark position only, because these measures span several orders of magnitude and bar length would not be proportional to the value.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .parity { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
    .peak { fill-opacity: 0.42; }
  </style>
  <rect width="1120" height="826" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Protection path cost per operation</text>
  <text x="32" y="62" font-size="13" class="muted">Five benchmark cases · one sample per case · linear axis from zero · Linux x86_64, Go 1.27.x, AMD EPYC</text>
  <rect class="panel" x="24" y="104" width="1072" height="212" rx="14"/>
  <text x="48" y="130" font-size="14" font-weight="650">Time per operation</text>
