  <text x="48" y="495.4" font-size="10.5" class="muted">1,000 bans</text>
  <line class="axis" x1="470" y1="480.4" x2="502.6" y2="480.4"/>
  <circle cx="502.6" cy="480.4" r="6" fill="#f59e0b"><title>nft ban-set compile, 1,000 bans: 1.139 MB</title></circle>
  <text x="514.6" y="484.4" font-size="11" font-weight="650" fill="#f59e0b">1.139 MB</text>
  <text x="48" y="509.8" font-size="12.5" font-weight="650">nft ban-set compile</text>
  <text x="48" y="525.8" font-size="10.5" class="muted">10,000 bans</text>
  <line class="axis" x1="470" y1="510.8" x2="959.8" y2="510.8"/>
  <circle cx="959.8" cy="510.8" r="6" fill="#ef4444"><title>nft ban-set compile, 10,000 bans: 17.12 MB</title></circle>
  <text x="971.8" y="514.8" font-size="11" font-weight="650" fill="#ef4444">17.12 MB</text>
  <rect class="panel" x="24" y="556" width="1072" height="212" rx="14"/>
  <text x="48" y="582" font-size="14" font-weight="650">Heap allocations per operation</text>
