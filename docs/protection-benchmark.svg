<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="826" viewBox="0 0 1120 826" role="img" aria-labelledby="title desc">
  <title id="title">Protection path cost per operation</title>
  <desc id="desc">Three panels of horizontal logarithmic bars. The latency panel shows time per operation, the memory panel shows heap bytes per operation, and the allocations panel shows heap allocation count per operation, for journal failure detection, CrowdSec decision decoding, and nft ban-set compilation at 100, 1,000, and 10,000 bans.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .parity { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
    .peak { fill-opacity: 0.42; }
  </style>
  <rect width="1120" height="826" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Protection path cost per operation</text>
  <text x="32" y="62" font-size="13" class="muted">Five benchmark cases · one sample per case · logarithmic bar length · Linux x86_64, Go 1.27.x, AMD EPYC</text>
  <rect class="panel" x="24" y="104" width="1072" height="212" rx="14"/>
  <text x="48" y="130" font-size="14" font-weight="650">Time per operation</text>
  <line class="grid" x1="470.0" y1="140" x2="470.0" y2="288"/>
  <text x="470.0" y="306" text-anchor="middle" font-size="10" class="muted">0.1 µs</text>
  <line class="grid" x1="580.0" y1="140" x2="580.0" y2="288"/>
  <text x="580.0" y="306" text-anchor="middle" font-size="10" class="muted">1 µs</text>
  <line class="grid" x1="690.0" y1="140" x2="690.0" y2="288"/>
  <text x="690.0" y="306" text-anchor="middle" font-size="10" class="muted">10 µs</text>
  <line class="grid" x1="800.0" y1="140" x2="800.0" y2="288"/>
  <text x="800.0" y="306" text-anchor="middle" font-size="10" class="muted">100 µs</text>
  <line class="grid" x1="910.0" y1="140" x2="910.0" y2="288"/>
  <text x="910.0" y="306" text-anchor="middle" font-size="10" class="muted">1 ms</text>
  <line class="grid" x1="1020.0" y1="140" x2="1020.0" y2="288"/>
  <text x="1020.0" y="306" text-anchor="middle" font-size="10" class="muted">10 ms</text>
  <text x="48" y="162.2" font-size="12.5" font-weight="650">Journal failure detector</text>
  <text x="48" y="178.2" font-size="10.5" class="muted">one failed-login event</text>
  <rect x="470" y="155.2" width="105.2" height="16" rx="4" fill="#0f9d8a"/>
  <text x="583.2" y="167.2" font-size="11" font-weight="650">0.905 µs</text>
  <text x="48" y="192.6" font-size="12.5" font-weight="650">CrowdSec JSON decode</text>
  <text x="48" y="208.6" font-size="10.5" class="muted">100 decisions</text>
  <rect x="470" y="185.6" width="303.0" height="16" rx="4" fill="#3b82f6"/>
