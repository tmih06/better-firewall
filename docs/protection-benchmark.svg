  <line class="grid" x1="470.0" y1="140" x2="470.0" y2="288"/>
  <text x="470.0" y="306" text-anchor="start" font-size="10" class="muted">0 ms</text>
  <line class="grid" x1="650.0" y1="140" x2="650.0" y2="288"/>
  <text x="650.0" y="306" text-anchor="middle" font-size="10" class="muted">3 ms</text>
  <line class="grid" x1="830.0" y1="140" x2="830.0" y2="288"/>
  <text x="830.0" y="306" text-anchor="middle" font-size="10" class="muted">6 ms</text>
  <line class="grid" x1="1010.0" y1="140" x2="1010.0" y2="288"/>
  <text x="1010.0" y="306" text-anchor="end" font-size="10" class="muted">9 ms</text>
  <text x="48" y="162.2" font-size="12.5" font-weight="650">Journal failure detector</text>
  <text x="48" y="178.2" font-size="10.5" class="muted">one failed-login event</text>
  <line class="axis" x1="470" y1="163.2" x2="470.1" y2="163.2"/>
  <circle cx="470.1" cy="163.2" r="6" fill="#0f9d8a"><title>Journal failure detector, one failed-login event: 0.905 µs</title></circle>
  <text x="482.1" y="167.2" font-size="11" font-weight="650" fill="#0f9d8a">0.905 µs</text>
  <text x="48" y="192.6" font-size="12.5" font-weight="650">CrowdSec JSON decode</text>
  <text x="48" y="208.6" font-size="10.5" class="muted">100 decisions</text>
  <line class="axis" x1="470" y1="193.6" x2="473.4" y2="193.6"/>
  <circle cx="473.4" cy="193.6" r="6" fill="#3b82f6"><title>CrowdSec JSON decode, 100 decisions: 56.86 µs</title></circle>
  <text x="485.4" y="197.6" font-size="11" font-weight="650" fill="#3b82f6">56.86 µs</text>
  <text x="48" y="223.0" font-size="12.5" font-weight="650">nft ban-set compile</text>
  <text x="48" y="239.0" font-size="10.5" class="muted">100 bans</text>
  <line class="axis" x1="470" y1="224.0" x2="474.7" y2="224.0"/>
