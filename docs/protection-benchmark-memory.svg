<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Protection benchmark memory use</title>
  <desc id="desc">Log-scale bytes allocated per operation: journal detection 122 bytes; CrowdSec decoding 100 decisions 26,086 bytes; nft set compilation 204,371 bytes for 100 bans, 1,138,720 bytes for 1,000 bans, and 17,119,184 bytes for 10,000 bans.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #fff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .detector { fill: #0f9d8a; }
    .crowdsec { fill: #3b82f6; }
    .ban100 { fill: #8b5cf6; }
    .ban1000 { fill: #f59e0b; }
    .ban10000 { fill: #ef4444; }
  </style>
  <rect width="1120" height="470" fill="#f1f5f9"/>
  <text x="32" y="36" font-size="24" font-weight="700">Memory allocated per operation</text>
  <text x="32" y="60" font-size="13" class="muted">Five benchmark cases · logarithmic x-axis · bytes/op</text>
  <rect class="panel" x="24" y="80" width="1072" height="365" rx="14"/>
  <text x="52" y="110" font-size="15" font-weight="650">Lower is less allocation</text>
  <text x="52" y="130" font-size="11" class="muted">Heap bytes per operation</text>
  <line class="grid" x1="350" y1="138" x2="350" y2="402"/>
  <line class="grid" x1="435.71" y1="138" x2="435.71" y2="402"/>
  <line class="grid" x1="521.43" y1="138" x2="521.43" y2="402"/>
  <line class="grid" x1="607.14" y1="138" x2="607.14" y2="402"/>
  <line class="grid" x1="692.86" y1="138" x2="692.86" y2="402"/>
  <line class="grid" x1="778.57" y1="138" x2="778.57" y2="402"/>
  <line class="grid" x1="864.29" y1="138" x2="864.29" y2="402"/>
  <line class="grid" x1="950" y1="138" x2="950" y2="402"/>
  <text x="52" y="160" font-size="13" font-weight="650">Journal detector</text><text x="52" y="177" font-size="11" class="muted">one failed-login event</text>
  <rect class="detector" x="350" y="145" width="93.12" height="18" rx="4"/><text x="451" y="160" font-size="12" font-weight="650">122 B</text>
  <text x="52" y="210" font-size="13" font-weight="650">CrowdSec decode</text><text x="52" y="227" font-size="11" class="muted">100 decisions per response</text>
  <rect class="crowdsec" x="350" y="195" width="292.83" height="18" rx="4"/><text x="651" y="210" font-size="12" font-weight="650">26,086 B</text>
  <text x="52" y="260" font-size="13" font-weight="650">nft set compile · 100</text><text x="52" y="277" font-size="11" class="muted">bans</text>
  <rect class="ban100" x="350" y="245" width="369.46" height="18" rx="4"/><text x="728" y="260" font-size="12" font-weight="650">204,371 B</text>
  <text x="52" y="310" font-size="13" font-weight="650">nft set compile · 1,000</text><text x="52" y="327" font-size="11" class="muted">bans</text>
  <rect class="ban1000" x="350" y="295" width="433.39" height="18" rx="4"/><text x="792" y="310" font-size="12" font-weight="650">1,138,720 B</text>
  <text x="52" y="360" font-size="13" font-weight="650">nft set compile · 10,000</text><text x="52" y="377" font-size="11" class="muted">bans</text>
  <rect class="ban10000" x="350" y="345" width="534.28" height="18" rx="4"/><text x="893" y="360" font-size="12" font-weight="650">17,119,184 B</text>
  <line class="axis" x1="350" y1="402" x2="950" y2="402"/>
  <text x="350" y="424" font-size="11" text-anchor="middle" class="muted">10 B</text>
  <text x="435.71" y="424" font-size="11" text-anchor="middle" class="muted">100 B</text>
  <text x="521.43" y="424" font-size="11" text-anchor="middle" class="muted">1 KB</text>
  <text x="607.14" y="424" font-size="11" text-anchor="middle" class="muted">10 KB</text>
  <text x="692.86" y="424" font-size="11" text-anchor="middle" class="muted">100 KB</text>
  <text x="778.57" y="424" font-size="11" text-anchor="middle" class="muted">1 MB</text>
  <text x="864.29" y="424" font-size="11" text-anchor="middle" class="muted">10 MB</text>
  <text x="950" y="424" font-size="11" text-anchor="middle" class="muted">100 MB</text>
</svg>
