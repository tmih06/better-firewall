<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">No measurable traffic cost at any rule count</title>
  <desc id="desc">Top row: correctness counters for the whole run - requests served, request errors, dropped iterations and k6 response checks that returned the expected body. Lower panels: mean p99 latency in milliseconds for no firewall, bfw and UFW at 10, 100, 500 and 1000 rules, one panel per traffic profile, each on its own linear axis from zero.</desc>
