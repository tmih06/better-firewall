<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">No measurable traffic cost at any rule count</title>
  <desc id="desc">Top row: correctness counters for the whole run. Lower panel: mean p95 latency of bfw and UFW expressed as a percentage deviation from the no-firewall container, one row per traffic profile and rule count. A shaded band marks plus or minus five percent. Deviations fall on both sides of zero, and bfw is faster than no firewall at all in half the rows, which no real firewall can be.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
  </style>
  <rect width="1120" height="690" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">No measurable traffic cost at any rule count</text>
  <text x="32" y="62" font-size="13" class="muted">Mean p95 over 3 repeats per cell &#183; Linux 6.17.0-1022-azure x86_64</text>
  <rect class="panel" x="24" y="86" width="251" height="96" rx="12"/>
  <text x="44" y="110" font-size="11.5" class="muted">Requests served</text>
  <text x="44" y="144" font-size="26" font-weight="700" fill="#0f9d8a">28,565,533</text>
  <text x="44" y="165" font-size="10" class="muted">no firewall, bfw and UFW</text>
  <rect class="panel" x="295" y="86" width="251" height="96" rx="12"/>
  <text x="315" y="110" font-size="11.5" class="muted">Request errors</text>
  <text x="315" y="144" font-size="26" font-weight="700" fill="#0f9d8a">0</text>
  <text x="315" y="165" font-size="10" class="muted">budget 1%</text>
  <rect class="panel" x="566" y="86" width="251" height="96" rx="12"/>
  <text x="586" y="110" font-size="11.5" class="muted">Dropped iterations</text>
  <text x="586" y="144" font-size="26" font-weight="700" fill="#0f9d8a">0</text>
  <text x="586" y="165" font-size="10" class="muted">load generator could not dispatch</text>
  <rect class="panel" x="837" y="86" width="251" height="96" rx="12"/>
  <text x="857" y="110" font-size="11.5" class="muted">Response checks passed</text>
  <text x="857" y="144" font-size="26" font-weight="700" fill="#0f9d8a">28,565,489</text>
  <text x="857" y="165" font-size="10" class="muted">expected body returned</text>
  <rect class="panel" x="24" y="200" width="1072" height="404" rx="12"/>
  <text x="48" y="228" font-size="13.5" font-weight="650">p95 latency versus the no-firewall container</text>
  <rect x="427.8" y="242" width="444.4" height="316" fill="#eef2f7"/>
  <line class="grid" x1="427.8" y1="242" x2="427.8" y2="558"/>
  <text x="427.8" y="576" text-anchor="middle" font-size="10.5" class="muted">-5%</text>
  <line class="grid" x1="538.9" y1="242" x2="538.9" y2="558"/>
  <text x="538.9" y="576" text-anchor="middle" font-size="10.5" class="muted">-2.5%</text>
  <line class="grid" x1="650.0" y1="242" x2="650.0" y2="558"/>
  <text x="650.0" y="576" text-anchor="middle" font-size="10.5" class="muted">0%</text>
  <line class="grid" x1="761.1" y1="242" x2="761.1" y2="558"/>
  <text x="761.1" y="576" text-anchor="middle" font-size="10.5" class="muted">+2.5%</text>
  <line class="grid" x1="872.2" y1="242" x2="872.2" y2="558"/>
  <text x="872.2" y="576" text-anchor="middle" font-size="10.5" class="muted">+5%</text>
  <line class="axis" x1="650.0" y1="242" x2="650.0" y2="558"/>
  <text x="232" y="266" text-anchor="end" font-size="11" class="muted">Keep-alive &#183; 10</text>
  <line x1="476.6" y1="262" x2="502.6" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="476.6" cy="262" r="5.5" fill="#0f9d8a"><title>Keep-alive &amp;#183; 10, bfw: -3.9% versus no firewall</title></circle>
  <circle cx="502.6" cy="262" r="5.5" fill="#3b82f6"><title>Keep-alive &amp;#183; 10, UFW: -3.3% versus no firewall</title></circle>
  <text x="232" y="292" text-anchor="end" font-size="11" class="muted">Keep-alive &#183; 100</text>
  <line x1="615.6" y1="288" x2="535.5" y2="288" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="615.6" cy="288" r="5.5" fill="#0f9d8a"><title>Keep-alive &amp;#183; 100, bfw: -0.8% versus no firewall</title></circle>
  <circle cx="535.5" cy="288" r="5.5" fill="#3b82f6"><title>Keep-alive &amp;#183; 100, UFW: -2.6% versus no firewall</title></circle>
  <text x="232" y="318" text-anchor="end" font-size="11" class="muted">Keep-alive &#183; 500</text>
  <line x1="599.8" y1="314" x2="592.7" y2="314" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="599.8" cy="314" r="5.5" fill="#0f9d8a"><title>Keep-alive &amp;#183; 500, bfw: -1.1% versus no firewall</title></circle>
  <circle cx="592.7" cy="314" r="5.5" fill="#3b82f6"><title>Keep-alive &amp;#183; 500, UFW: -1.3% versus no firewall</title></circle>
  <text x="232" y="344" text-anchor="end" font-size="11" class="muted">Keep-alive &#183; 1,000</text>
  <line x1="334.8" y1="340" x2="404.3" y2="340" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="334.8" cy="340" r="5.5" fill="#0f9d8a"><title>Keep-alive &amp;#183; 1,000, bfw: -7.1% versus no firewall</title></circle>
  <circle cx="404.3" cy="340" r="5.5" fill="#3b82f6"><title>Keep-alive &amp;#183; 1,000, UFW: -5.5% versus no firewall</title></circle>
  <line x1="48" y1="353.0" x2="1072" y2="353.0" stroke="#eef2f7" stroke-width="1"/>
  <text x="232" y="370" text-anchor="end" font-size="11" class="muted">Connection churn &#183; 10</text>
  <line x1="680.5" y1="366" x2="665.3" y2="366" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="680.5" cy="366" r="5.5" fill="#0f9d8a"><title>Connection churn &amp;#183; 10, bfw: +0.7% versus no firewall</title></circle>
  <circle cx="665.3" cy="366" r="5.5" fill="#3b82f6"><title>Connection churn &amp;#183; 10, UFW: +0.3% versus no firewall</title></circle>
  <text x="232" y="396" text-anchor="end" font-size="11" class="muted">Connection churn &#183; 100</text>
  <line x1="623.1" y1="392" x2="542.3" y2="392" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="623.1" cy="392" r="5.5" fill="#0f9d8a"><title>Connection churn &amp;#183; 100, bfw: -0.6% versus no firewall</title></circle>
  <circle cx="542.3" cy="392" r="5.5" fill="#3b82f6"><title>Connection churn &amp;#183; 100, UFW: -2.4% versus no firewall</title></circle>
  <text x="232" y="422" text-anchor="end" font-size="11" class="muted">Connection churn &#183; 500</text>
  <line x1="855.8" y1="418" x2="917.5" y2="418" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="855.8" cy="418" r="5.5" fill="#0f9d8a"><title>Connection churn &amp;#183; 500, bfw: +4.6% versus no firewall</title></circle>
  <circle cx="917.5" cy="418" r="5.5" fill="#3b82f6"><title>Connection churn &amp;#183; 500, UFW: +6.0% versus no firewall</title></circle>
  <text x="232" y="448" text-anchor="end" font-size="11" class="muted">Connection churn &#183; 1,000</text>
  <line x1="349.3" y1="444" x2="427.8" y2="444" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="349.3" cy="444" r="5.5" fill="#0f9d8a"><title>Connection churn &amp;#183; 1,000, bfw: -6.8% versus no firewall</title></circle>
  <circle cx="427.8" cy="444" r="5.5" fill="#3b82f6"><title>Connection churn &amp;#183; 1,000, UFW: -5.0% versus no firewall</title></circle>
  <line x1="48" y1="457.0" x2="1072" y2="457.0" stroke="#eef2f7" stroke-width="1"/>
  <text x="232" y="474" text-anchor="end" font-size="11" class="muted">Mixed payload &#183; 10</text>
  <line x1="798.8" y1="470" x2="714.0" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="798.8" cy="470" r="5.5" fill="#0f9d8a"><title>Mixed payload &amp;#183; 10, bfw: +3.3% versus no firewall</title></circle>
  <circle cx="714.0" cy="470" r="5.5" fill="#3b82f6"><title>Mixed payload &amp;#183; 10, UFW: +1.4% versus no firewall</title></circle>
  <text x="232" y="500" text-anchor="end" font-size="11" class="muted">Mixed payload &#183; 100</text>
  <line x1="763.1" y1="496" x2="587.4" y2="496" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="763.1" cy="496" r="5.5" fill="#0f9d8a"><title>Mixed payload &amp;#183; 100, bfw: +2.5% versus no firewall</title></circle>
  <circle cx="587.4" cy="496" r="5.5" fill="#3b82f6"><title>Mixed payload &amp;#183; 100, UFW: -1.4% versus no firewall</title></circle>
  <text x="232" y="526" text-anchor="end" font-size="11" class="muted">Mixed payload &#183; 500</text>
  <line x1="711.1" y1="522" x2="857.1" y2="522" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="711.1" cy="522" r="5.5" fill="#0f9d8a"><title>Mixed payload &amp;#183; 500, bfw: +1.4% versus no firewall</title></circle>
  <circle cx="857.1" cy="522" r="5.5" fill="#3b82f6"><title>Mixed payload &amp;#183; 500, UFW: +4.7% versus no firewall</title></circle>
  <text x="232" y="552" text-anchor="end" font-size="11" class="muted">Mixed payload &#183; 1,000</text>
  <line x1="667.5" y1="548" x2="705.7" y2="548" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="667.5" cy="548" r="5.5" fill="#0f9d8a"><title>Mixed payload &amp;#183; 1,000, bfw: +0.4% versus no firewall</title></circle>
  <circle cx="705.7" cy="548" r="5.5" fill="#3b82f6"><title>Mixed payload &amp;#183; 1,000, UFW: +1.3% versus no firewall</title></circle>
  <rect x="24" y="620" width="12" height="12" rx="3" class="bfw"/>
  <text x="42" y="630" font-size="11.5">bfw</text>
  <rect x="73.8" y="620" width="12" height="12" rx="3" class="ufw"/>
  <text x="91.8" y="630" font-size="11.5">UFW</text>
  <text x="139.6" y="630" font-size="11" class="muted">Both measured against the no-firewall container. Shaded band is a plus or minus 5% reference, not a fitted range: 5 of 24 dots fall outside it.</text>
  <text x="24" y="652" font-size="11" class="muted">bfw is faster than no firewall at all in 6 of 12 rows. A firewall cannot remove latency, so both signs are noise; largest deviation anywhere is 7.1%.</text>
  <text x="24" y="672" font-size="11" class="muted">p99 is not shown: the churn profile issues about 2,000 requests per repeat, so its p99 swings from -31.7% to +21.9% on identical engines.</text>
</svg>
