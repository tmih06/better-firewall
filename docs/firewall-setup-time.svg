<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Firewall rule setup time: bfw and UFW</title>
  <desc id="desc">Hosted CI mean wall-clock time to add rules and enable the firewall, measured over three repeats. bfw versus UFW total time: 0.0494 versus 1.6382 seconds at 10 rules; 0.4113 versus 12.0659 at 100; 2.4647 versus 60.0879 at 500; 9.7789 versus 168.6403 at 1,000. Reported total speedups range from 17.25x to 33.16x.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #fff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
  </style>
  <rect width="1120" height="560" fill="#f1f5f9"/>
  <text x="32" y="36" font-size="24" font-weight="700">Rule setup + firewall enable time</text>
  <text x="32" y="60" font-size="13" class="muted">Mean wall-clock seconds · 3 repeats · logarithmic axis</text>
  <rect class="panel" x="24" y="80" width="1072" height="450" rx="14"/>
  <text x="52" y="115" font-size="12" font-weight="650" class="muted">RULE COUNT</text>
  <rect class="bfw" x="710" y="103" width="12" height="12" rx="3"/><text x="728" y="114" font-size="12">bfw</text>
  <rect class="ufw" x="790" y="103" width="12" height="12" rx="3"/><text x="808" y="114" font-size="12">UFW</text>
  <line class="grid" x1="320" y1="130" x2="320" y2="440"/>
  <line class="grid" x1="446" y1="130" x2="446" y2="440"/>
  <line class="grid" x1="572" y1="130" x2="572" y2="440"/>
  <line class="grid" x1="698" y1="130" x2="698" y2="440"/>
  <line class="grid" x1="824" y1="130" x2="824" y2="440"/>
  <line class="grid" x1="950" y1="130" x2="950" y2="440"/>
  <text x="52" y="170" font-size="14" font-weight="650">10 rules</text><rect class="bfw" x="320" y="150" width="87.4" height="17" rx="4"/><text x="416" y="163" font-size="12" font-weight="650">0.049 s</text><rect class="ufw" x="320" y="174" width="279.6" height="17" rx="4"/><text x="608" y="187" font-size="12" font-weight="650">1.638 s</text><text x="790" y="173" font-size="12" font-weight="650">33.16× faster</text>
  <text x="52" y="245" font-size="14" font-weight="650">100 rules</text><rect class="bfw" x="320" y="225" width="203.4" height="17" rx="4"/><text x="533" y="238" font-size="12" font-weight="650">0.411 s</text><rect class="ufw" x="320" y="249" width="388.3" height="17" rx="4"/><text x="718" y="262" font-size="12" font-weight="650">12.066 s</text><text x="864" y="248" font-size="12" font-weight="650">29.34× faster</text>
  <text x="52" y="320" font-size="14" font-weight="650">500 rules</text><rect class="bfw" x="320" y="300" width="301.4" height="17" rx="4"/><text x="630" y="313" font-size="12" font-weight="650">2.465 s</text><rect class="ufw" x="320" y="324" width="476.1" height="17" rx="4"/><text x="805" y="337" font-size="12" font-weight="650">60.088 s</text><text x="885" y="323" font-size="12" font-weight="650">24.38× faster</text>
  <text x="52" y="395" font-size="14" font-weight="650">1,000 rules</text><rect class="bfw" x="320" y="375" width="376.8" height="17" rx="4"/><text x="704" y="388" font-size="12" font-weight="650">9.779 s</text><rect class="ufw" x="320" y="399" width="532.6" height="17" rx="4"/><text x="858" y="412" font-size="12" font-weight="650">168.640 s</text><text x="948" y="398" font-size="12" font-weight="650">17.25× faster</text>
  <line x1="320" y1="440" x2="950" y2="440" stroke="#94a3b8"/>
  <text x="320" y="463" font-size="11" text-anchor="middle" class="muted">0.01 s</text>
  <text x="446" y="463" font-size="11" text-anchor="middle" class="muted">0.1 s</text>
  <text x="572" y="463" font-size="11" text-anchor="middle" class="muted">1 s</text>
  <text x="698" y="463" font-size="11" text-anchor="middle" class="muted">10 s</text>
  <text x="824" y="463" font-size="11" text-anchor="middle" class="muted">100 s</text>
  <text x="950" y="463" font-size="11" text-anchor="middle" class="muted">1,000 s</text>
  <text x="52" y="505" font-size="11" class="muted">Total includes rule-add commands and firewall enable/apply. Not packet-processing latency.</text>
</svg>
