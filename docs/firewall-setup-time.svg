<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Rule setup is 8-32x faster than UFW</title>
  <desc id="desc">Four small-multiple bar charts, one per rule count, each with its own linear axis starting at zero. Every panel compares the wall-clock seconds for bfw and for UFW to add the rules and enable the firewall. Panels use independent scales and are not comparable to each other; the speed-up multiple is printed in each panel.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
  </style>
  <rect width="1120" height="540" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Rule setup is 8-32x faster than UFW</text>
  <text x="32" y="62" font-size="13" class="muted">Mean of 3 repeats per engine &#183; Linux 6.17.0-1022-azure x86_64</text>
  <rect class="panel" x="24" y="100" width="524" height="152" rx="12"/>
  <text x="44" y="125" font-size="14" font-weight="650">10 rules</text>
  <text x="528" y="125" text-anchor="end" font-size="13" font-weight="700" fill="#0f9d8a">31.8x faster</text>
  <line class="grid" x1="82.0" y1="136" x2="82.0" y2="208"/>
  <text x="82.0" y="226" text-anchor="middle" font-size="10.5" class="muted">0 s</text>
  <line class="grid" x1="276.0" y1="136" x2="276.0" y2="208"/>
  <text x="276.0" y="226" text-anchor="middle" font-size="10.5" class="muted">1 s</text>
  <line class="grid" x1="470.0" y1="136" x2="470.0" y2="208"/>
  <text x="470.0" y="226" text-anchor="middle" font-size="10.5" class="muted">2 s</text>
  <line class="axis" x1="82" y1="136" x2="82" y2="208"/>
  <text x="44" y="159" font-size="11" font-weight="650" fill="#0f9d8a">bfw</text>
  <rect class="bfw" x="82" y="140" width="9.8" height="27" rx="4"><title>bfw, 10 rules: 0.05 s</title></rect>
  <text x="99.8" y="159" font-size="11.5" font-weight="650" fill="#0f9d8a">0.05 s</text>
  <text x="44" y="193" font-size="11" font-weight="650" fill="#3b82f6">UFW</text>
  <rect class="ufw" x="82" y="174" width="311.2" height="27" rx="4"><title>UFW, 10 rules: 1.60 s</title></rect>
  <text x="401.2" y="193" font-size="11.5" font-weight="650" fill="#3b82f6">1.60 s</text>
  <rect class="panel" x="568" y="100" width="524" height="152" rx="12"/>
  <text x="588" y="125" font-size="14" font-weight="650">100 rules</text>
  <text x="1072" y="125" text-anchor="end" font-size="13" font-weight="700" fill="#0f9d8a">24.5x faster</text>
  <line class="grid" x1="626.0" y1="136" x2="626.0" y2="208"/>
  <text x="626.0" y="226" text-anchor="middle" font-size="10.5" class="muted">0 s</text>
  <line class="grid" x1="820.0" y1="136" x2="820.0" y2="208"/>
  <text x="820.0" y="226" text-anchor="middle" font-size="10.5" class="muted">5 s</text>
  <line class="grid" x1="1014.0" y1="136" x2="1014.0" y2="208"/>
  <text x="1014.0" y="226" text-anchor="middle" font-size="10.5" class="muted">10 s</text>
  <line class="axis" x1="626" y1="136" x2="626" y2="208"/>
  <text x="588" y="159" font-size="11" font-weight="650" fill="#0f9d8a">bfw</text>
  <rect class="bfw" x="626" y="140" width="15.2" height="27" rx="4"><title>bfw, 100 rules: 0.39 s</title></rect>
  <text x="649.2" y="159" font-size="11.5" font-weight="650" fill="#0f9d8a">0.39 s</text>
  <text x="588" y="193" font-size="11" font-weight="650" fill="#3b82f6">UFW</text>
  <rect class="ufw" x="626" y="174" width="373.3" height="27" rx="4"><title>UFW, 100 rules: 9.62 s</title></rect>
  <text x="1007.3" y="193" font-size="11.5" font-weight="650" fill="#3b82f6">9.62 s</text>
  <rect class="panel" x="24" y="272" width="524" height="152" rx="12"/>
  <text x="44" y="297" font-size="14" font-weight="650">500 rules</text>
  <text x="528" y="297" text-anchor="end" font-size="13" font-weight="700" fill="#0f9d8a">19.4x faster</text>
  <line class="grid" x1="82.0" y1="308" x2="82.0" y2="380"/>
  <text x="82.0" y="398" text-anchor="middle" font-size="10.5" class="muted">0 s</text>
  <line class="grid" x1="276.0" y1="308" x2="276.0" y2="380"/>
  <text x="276.0" y="398" text-anchor="middle" font-size="10.5" class="muted">35 s</text>
  <line class="grid" x1="470.0" y1="308" x2="470.0" y2="380"/>
  <text x="470.0" y="398" text-anchor="middle" font-size="10.5" class="muted">70 s</text>
  <line class="axis" x1="82" y1="308" x2="82" y2="380"/>
  <text x="44" y="331" font-size="11" font-weight="650" fill="#0f9d8a">bfw</text>
  <rect class="bfw" x="82" y="312" width="17.8" height="27" rx="4"><title>bfw, 500 rules: 3.22 s</title></rect>
  <text x="107.8" y="331" font-size="11.5" font-weight="650" fill="#0f9d8a">3.22 s</text>
  <text x="44" y="365" font-size="11" font-weight="650" fill="#3b82f6">UFW</text>
  <rect class="ufw" x="82" y="346" width="347.1" height="27" rx="4"><title>UFW, 500 rules: 62.62 s</title></rect>
  <text x="437.1" y="365" font-size="11.5" font-weight="650" fill="#3b82f6">62.62 s</text>
  <rect class="panel" x="568" y="272" width="524" height="152" rx="12"/>
  <text x="588" y="297" font-size="14" font-weight="650">1,000 rules</text>
  <text x="1072" y="297" text-anchor="end" font-size="13" font-weight="700" fill="#0f9d8a">18.0x faster</text>
  <line class="grid" x1="626.0" y1="308" x2="626.0" y2="380"/>
  <text x="626.0" y="398" text-anchor="middle" font-size="10.5" class="muted">0 s</text>
  <line class="grid" x1="820.0" y1="308" x2="820.0" y2="380"/>
  <text x="820.0" y="398" text-anchor="middle" font-size="10.5" class="muted">80 s</text>
  <line class="grid" x1="1014.0" y1="308" x2="1014.0" y2="380"/>
  <text x="1014.0" y="398" text-anchor="middle" font-size="10.5" class="muted">160 s</text>
  <line class="axis" x1="626" y1="308" x2="626" y2="380"/>
  <text x="588" y="331" font-size="11" font-weight="650" fill="#0f9d8a">bfw</text>
  <rect class="bfw" x="626" y="312" width="21.0" height="27" rx="4"><title>bfw, 1,000 rules: 8.67 s</title></rect>
  <text x="655.0" y="331" font-size="11.5" font-weight="650" fill="#0f9d8a">8.67 s</text>
  <text x="588" y="365" font-size="11" font-weight="650" fill="#3b82f6">UFW</text>
  <rect class="ufw" x="626" y="346" width="379.1" height="27" rx="4"><title>UFW, 1,000 rules: 156.33 s</title></rect>
  <text x="1013.1" y="365" font-size="11.5" font-weight="650" fill="#3b82f6">156.33 s</text>
  <text x="24" y="486" font-size="11" class="muted">Configuration and apply time only, not packet-processing latency. UFW rewrites and reloads the whole ruleset once per rule; bfw compiles the entire ruleset in one atomic nftables transaction.</text>
  <text x="24" y="506" font-size="11" class="muted">Each panel has its own linear axis from zero. Do not compare bar lengths across panels; compare the two bars within a panel.</text>
</svg>
