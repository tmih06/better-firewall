<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Rule setup is 8-32x faster than UFW</title>
  <desc id="desc">Grouped horizontal bar chart. One bar per rule count showing the speed-up of bfw over UFW for the combined time to add the rules and enable the firewall. Bar length is the speed-up multiple on a linear axis from zero. The absolute wall-clock seconds for both firewalls are printed beside every bar.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172554; }
    .muted { fill: #64748b; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .base { fill: #64748b; }
    .bfw { fill: #0f9d8a; }
    .ufw { fill: #3b82f6; }
  </style>
  <rect width="1120" height="560" fill="#f1f5f9"/>
  <text x="32" y="38" font-size="24" font-weight="700">Rule setup is 8-32x faster than UFW</text>
  <text x="32" y="62" font-size="13" class="muted">Mean of 3 repeats per engine · Linux 6.17.0-1022-azure x86_64</text>
  <rect class="panel" x="24" y="108" width="1072" height="336" rx="14"/>
  <line class="grid" x1="300.0" y1="140" x2="300.0" y2="418"/>
  <text x="300.0" y="436" text-anchor="start" font-size="11" class="muted">0x</text>
  <line class="grid" x1="460.0" y1="140" x2="460.0" y2="418"/>
  <text x="460.0" y="436" text-anchor="middle" font-size="11" class="muted">10x</text>
  <line class="grid" x1="620.0" y1="140" x2="620.0" y2="418"/>
  <text x="620.0" y="436" text-anchor="middle" font-size="11" class="muted">20x</text>
  <line class="grid" x1="780.0" y1="140" x2="780.0" y2="418"/>
  <text x="780.0" y="436" text-anchor="middle" font-size="11" class="muted">30x</text>
  <line class="grid" x1="940.0" y1="140" x2="940.0" y2="418"/>
  <text x="940.0" y="436" text-anchor="end" font-size="11" class="muted">40x</text>
  <line class="axis" x1="300" y1="140" x2="300" y2="418"/>
  <text x="52" y="182" font-size="14" font-weight="650">10 rules</text>
  <rect class="bfw" x="300" y="160" width="508.2" height="30" rx="4"><title>10 rules: bfw 0.05 s vs UFW 1.60 s = 31.8x</title></rect>
  <text x="818.2" y="181" font-size="13" font-weight="700" fill="#0f9d8a">31.8x</text>
  <text x="300" y="208" font-size="11" class="muted">bfw 0.05 s &#183; UFW 1.60 s</text>
  <text x="52" y="250" font-size="14" font-weight="650">100 rules</text>
  <rect class="bfw" x="300" y="228" width="392.0" height="30" rx="4"><title>100 rules: bfw 0.39 s vs UFW 9.62 s = 24.5x</title></rect>
  <text x="702.0" y="249" font-size="13" font-weight="700" fill="#0f9d8a">24.5x</text>
  <text x="300" y="276" font-size="11" class="muted">bfw 0.39 s &#183; UFW 9.62 s</text>
  <text x="52" y="318" font-size="14" font-weight="650">500 rules</text>
  <rect class="bfw" x="300" y="296" width="311.2" height="30" rx="4"><title>500 rules: bfw 3.22 s vs UFW 62.62 s = 19.4x</title></rect>
  <text x="621.2" y="317" font-size="13" font-weight="700" fill="#0f9d8a">19.4x</text>
  <text x="300" y="344" font-size="11" class="muted">bfw 3.22 s &#183; UFW 62.62 s</text>
  <text x="52" y="386" font-size="14" font-weight="650">1,000 rules</text>
  <rect class="bfw" x="300" y="364" width="288.5" height="30" rx="4"><title>1,000 rules: bfw 8.67 s vs UFW 156.33 s = 18.0x</title></rect>
  <text x="598.5" y="385" font-size="13" font-weight="700" fill="#0f9d8a">18.0x</text>
  <text x="300" y="412" font-size="11" class="muted">bfw 8.67 s &#183; UFW 156.33 s</text>
  <text x="620" y="458" text-anchor="middle" font-size="11" class="muted">Speed-up of bfw over UFW (higher is better)</text>
  <text x="32" y="490" font-size="11" class="muted">Configuration and apply time only. This is not packet-processing latency.</text>
  <text x="32" y="510" font-size="11" class="muted">UFW slows down superlinearly with rule count (one iptables-save per rule); bfw compiles the whole ruleset in a single atomic nftables transaction.</text>
  <text x="32" y="530" font-size="11" class="muted">The axis is linear from zero, so bar length is proportional to the multiple shown.</text>
</svg>
